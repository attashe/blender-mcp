[project]
name = "mcp-for-blender"
version = "2.3.1+minimal.2"
description = "A local Blender MCP server for Python, scene inspection, and visual feedback"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.26.0,<2",
]

[project.scripts]
mcp-for-blender = "blender_mcp.server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py"]

[project.urls]
"Homepage" = "https://github.com/attashe/blender-mcp"
"Bug Tracker" = "https://github.com/attashe/blender-mcp/issues"
